# cargo-deny configuration. Read the job log: an advisory acknowledgement is the PM's call at gate.
[graph]
all-features = true

[advisories]
version = 2
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no patched version; direct dependency. Dated ignore aligned with auth-framework main #499: re-review by 2026-12-17." },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
