name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Windows
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe_suffix: .exe
            archive_suffix: .zip
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            exe_suffix: .exe
            archive_suffix: .zip
          
          # macOS
          - os: macos-latest
            target: x86_64-apple-darwin
            exe_suffix: ""
            archive_suffix: .tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            exe_suffix: ""
            archive_suffix: .tar.gz
          
          # Linux
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe_suffix: ""
            archive_suffix: .tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            exe_suffix: ""
            archive_suffix: .tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe_suffix: ""
            archive_suffix: .tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            exe_suffix: ""
            archive_suffix: .tar.gz

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
    
    - name: Install cross-compilation tools (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        
        # Remove any conflicting packages first
        sudo apt-get remove -y gcc-multilib || true
        
        # Install musl tools for musl targets
        if [[ "${{ matrix.target }}" == *"musl"* ]]; then
          sudo apt-get install -y musl-tools
          if [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            mkdir -p ~/.cargo
            echo '[target.aarch64-unknown-linux-musl]' >> ~/.cargo/config.toml
            echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
          fi
        fi
        
        # Configure cross-compilation for aarch64 GNU
        if [[ "${{ matrix.target }}" == "aarch64-unknown-linux-gnu" ]]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu
          mkdir -p ~/.cargo
          echo '[target.aarch64-unknown-linux-gnu]' >> ~/.cargo/config.toml
          echo 'linker = "aarch64-linux-gnu-gcc"' >> ~/.cargo/config.toml
        fi

    - name: Cache cargo registry
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-target-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Build binary
      run: cargo build --locked --release --target ${{ matrix.target }}

    - name: Run tests (native target only)
      if: matrix.target == 'x86_64-pc-windows-msvc' || matrix.target == 'x86_64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
      run: cargo test --locked --release

    - name: Create archive directory
      shell: bash
      run: mkdir -p dist

    - name: Copy binary and create archive (Windows)
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        cp target/${{ matrix.target }}/release/json-mcp-server${{ matrix.exe_suffix }} dist/
        cp README.md LICENSE-MIT LICENSE-APACHE dist/
        cd dist
        7z a ../json-mcp-server-$VERSION-${{ matrix.target }}${{ matrix.archive_suffix }} *

    - name: Copy binary and create archive (Unix)
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        cp target/${{ matrix.target }}/release/json-mcp-server${{ matrix.exe_suffix }} dist/
        cp README.md LICENSE-MIT LICENSE-APACHE dist/
        cd dist
        tar czf ../json-mcp-server-$VERSION-${{ matrix.target }}${{ matrix.archive_suffix }} *

    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: json-mcp-server-${{ matrix.target }}
        path: json-mcp-server-*-${{ matrix.target }}${{ matrix.archive_suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: artifacts

    - name: Create Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: artifacts/**/*
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
